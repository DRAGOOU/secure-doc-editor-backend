<!DOCTYPE html>
<html>
    <head>
        <title>Document Editor</title>
        <style>
          body {
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0f172a, #020617);
        color: #e2e8f0;
    }

    h2 {
        text-align: center;
        padding: 15px;
        color: #38bdf8;
        letter-spacing: 1px;
    }

    button {
        padding: 10px 18px;
        margin: 10px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
        box-shadow: 0 0 10px rgba(56,189,248,0.4);
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(56,189,248,0.8);
    }

    #editor {
        display: block;
        width: 90%;
        height: 500px;
        margin: 20px auto;
        border-radius: 12px;
        border: 1px solid #334155;
        background: #020617;
        color: #e2e8f0;
        padding: 15px;
        font-size: 16px;
        resize: none;
        outline: none;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    #editor:focus {
        border: 1px solid #38bdf8;
        box-shadow: 0 0 20px rgba(56,189,248,0.5);
    } 
        </style>
    </head>
    <body>
       <h2>Document Editor</h2>
       <button onclick="goBack()">Back to Dashboard</button>
       <textarea id="editor"placeholder="Start typing..."></textarea>
       <p id="typingStatus" style="color:#38bdf8;"></p>
       <p id="status" style="text-align:center; color:#94a3b8;">Connected</p>
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script> 
        <script>
        console.log("JS IS RUNNING");
        const editor = document.getElementById("editor");

const token = localStorage.getItem("token");
if (!token) {
    localStorage.setItem("redirectAfterLogin", window.location.href);
    alert("You are not logged in");
    window.location.href = "index.html";
}

const params = new URLSearchParams(window.location.search);
let documentId = params.get("id");
const shareToken = params.get("share");

if (!documentId && !shareToken) {
    alert("No document specified");
    window.location.href = "dashboard.html";
}

async function init() {

    // 🔹 STEP 1: Load shared document if exists
    if (shareToken) {
        try {
            const res = await fetch(`http://localhost:5000/share/${shareToken}`);

            if (!res.ok) {
                alert("Invalid or expired link");
                window.location.href = "dashboard.html";
                return;
            }

            const data = await res.json();

            documentId = data.id;
            editor.value = data.content;

        } catch (err) {
            alert("Error loading shared document");
            window.location.href = "dashboard.html";
            return;
        }
    }

    // 🔹 STEP 2: Connect socket AFTER we have documentId
    const socket = io("http://127.0.0.1:5000", {
        auth: { token: token },
        transports: ["websocket"]
    });

    socket.on("connect", () => {
        document.getElementById("status").innerText = "🟢 Connected";

        socket.emit("join-document", {
            documentId: documentId,
            shareToken: shareToken
        });
    });

    let isRemoteUpdate = false;
    let lastSaved = "";

    socket.on("load-document", (content) => {
        editor.value = content;
        lastSaved = content;
    });

    socket.on("receive-changes", (data) => {
        isRemoteUpdate = true;
        editor.value = data;
        isRemoteUpdate = false;
    });

    editor.addEventListener("input", () => {
        if (isRemoteUpdate) return;

        socket.emit("send-changes", editor.value);
        socket.emit("typing");
    });

    setInterval(() => {
        if (editor.value !== lastSaved) {
            socket.emit("save-document", { content: editor.value });
            lastSaved = editor.value;
        }
    }, 2000);

    socket.on("user-typing", (data) => {
        const status = document.getElementById("typingStatus");
        status.innerText = data.name + " is typing...";
        setTimeout(() => {
            status.innerText = "";
        }, 1500);
    });

    socket.on("error", (msg) => {
        alert(msg);
        window.location.href = "dashboard.html";
    });
}
init();
function goBack() {
    window.location.href = "dashboard.html";
}
       </script>
    </body>
</html>
